---
deployment:
  tasks:
    - export DEPLOYPATH=/home3/afaolain/repositories/fk_olaine_code/
    - mkdir -p /home3/afaolain/fk_olaine-data/uploads
    - if [ -d "$DEPLOYPATH/public/uploads" ] && [ ! -L "$DEPLOYPATH/public/uploads" ]; then rsync -a "$DEPLOYPATH/public/uploads/" /home3/afaolain/fk_olaine-data/uploads/ && rm -rf "$DEPLOYPATH/public/uploads"; fi
    - if [ -d "$DEPLOYPATH/uploads" ] && [ ! -L "$DEPLOYPATH/uploads" ]; then rsync -a "$DEPLOYPATH/uploads/" /home3/afaolain/fk_olaine-data/uploads/ && rm -rf "$DEPLOYPATH/uploads"; fi
    - /usr/bin/rsync -a --delete --exclude='.git' --exclude='.env' --exclude='node_modules' --exclude='.next' --exclude='uploads' ./ $DEPLOYPATH
    - ln -sfn /home3/afaolain/fk_olaine-data/uploads $DEPLOYPATH/uploads
    - source /home3/afaolain/nodevenv/repositories/fk_olaine_code/24/bin/activate && cd $DEPLOYPATH && rm -rf node_modules && npm install && npm run build -- --webpack
    - mkdir -p $DEPLOYPATH/tmp && touch $DEPLOYPATH/tmp/restart.txt
